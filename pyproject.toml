[build-system]
requires = [
    "setuptools >= 40.6.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "classic-falcon-integration"
version = "2.0.1"
authors = [
    {name = "Sergey Variasov", email = "variasov@gmail.com"},
]
description = "Provides integrations of classic libs with Falcon web framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "falcon~=4.2",
    "orjson~=3.11",
    "classic-error-handling~=0.2",
    "pydantic~=2.12",
]

[project.urls]
Homepage = "https://github.com/variasov/classic-falcon-integration"

[tool.setuptools.packages.find]
where = ["sources"]
namespaces = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
